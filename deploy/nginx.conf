server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 'ok'; }
    # Full-site archives may exceed the 2 GiB per-material limit.
    location = /api/admin/restore {
        client_max_body_size 0;
        client_body_timeout 7200s;
        proxy_request_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass $api_backend;
    }
    location = /api/admin/upload {
        client_max_body_size 2049m;
        client_body_timeout 7200s;
        proxy_request_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass $api_backend;
    }
    location ^~ /api/internal/ { return 404; }
    location /api/ {
        client_max_body_size 2m;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass $api_backend;
    }
    location ^~ /uploads/ {
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_set_header Host $host;
        proxy_pass $api_backend;
    }
    location ~ /\. { deny all; }
    # Missing downloads must return 404 rather than React HTML.
    location ~* \.(?:js|css|json|map|png|jpg|jpeg|webp|gif|svg|ico|pdf|docx?|xlsx?|zip|otf|woff2?|mp4|webm)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
